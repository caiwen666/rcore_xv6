[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
array-macro = "2.1.8"
bitflags = "2.11.1"
buddy_system_allocator = "0.13.0"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
riscv = "0.16.0"
safe-mmio = "0.3.0"
slabmalloc = { path = "crates/slabmalloc" }
xmas-elf = "0.10.0"
zerocopy = "0.8.48"
